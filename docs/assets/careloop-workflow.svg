<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B42332" />
      <stop offset="100%" stop-color="#8F1928" />
    </linearGradient>

    <filter id="wfCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8F1928" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.04" />
    </filter>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B42332" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9CA3AF" />
    </marker>
  </defs>

  <style>
    .wf-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .wf-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="520" rx="16" fill="url(#wfBg)" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <g transform="translate(48, 36)" class="wf-sans">
    <rect width="154" height="24" rx="12" fill="#FAF0F1" stroke="#F0D9DC" stroke-width="1" />
    <text x="77" y="16" font-size="11" font-weight="700" fill="#8F1928" text-anchor="middle" letter-spacing="1">END-TO-END WORKFLOW</text>
    
    <text x="0" y="54" font-size="24" font-weight="800" fill="#202124" letter-spacing="-0.5">Emergency Blood Triage &amp; Dispatch Lifecycle</text>
    <text x="0" y="74" font-size="13.5" font-weight="500" fill="#687078">From bedside request creation to verified cross-matching and donor transfusion logging</text>
  </g>

  <!-- Flowchart Stages Container -->
  <!-- ROW 1: 4 Stages (Left to Right) -->
  <g transform="translate(48, 130)" class="wf-sans">

    <!-- Connector Lines Row 1 -->
    <path d="M 235 75 L 285 75" fill="none" stroke="#B42332" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 525 75 L 575 75" fill="none" stroke="#B42332" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 815 75 L 865 75" fill="none" stroke="#B42332" stroke-width="2" marker-end="url(#arrowRed)" />

    <!-- Connecting Arc from Row 1 End to Row 2 End (Downwards on right) -->
    <path d="M 1000 150 C 1000 190, 1000 190, 1000 215" fill="none" stroke="#B42332" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />

    <!-- STAGE 1: Request Creation -->
    <g transform="translate(0, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">1</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Emergency Request</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• Hospital / Patient Bedside</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Blood Group, Units &amp; Urgency</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• Geo-coordinates (PostGIS)</text>
        <rect x="0" y="98" width="80" height="18" rx="4" fill="#FEF3C7" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#92400E">INTAKE STAGE</text>
      </g>
    </g>

    <!-- STAGE 2: Compatibility Engine -->
    <g transform="translate(290, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">2</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Compatibility Engine</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• ABO / Rh Matrix Filtering</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• NBTC 2023 Triage Guidelines</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• 90-Day Deferral Verification</text>
        <rect x="0" y="98" width="94" height="18" rx="4" fill="#E0E7FF" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#3730A3">MATCH ENGINE</text>
      </g>
    </g>

    <!-- STAGE 3: Multi-Channel Dispatch -->
    <g transform="translate(580, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">3</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Realtime Dispatch</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• WebSocket Push Broadcast</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Firebase Cloud Messaging</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• Dynamic Geo-radius Tiers</text>
        <rect x="0" y="98" width="96" height="18" rx="4" fill="#DCFCE7" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#166534">REALTIME ALERT</text>
      </g>
    </g>

    <!-- STAGE 4: Medical Hold & Clearance -->
    <g transform="translate(870, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">4</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Clinical Gatekeeper</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• Medical Clearance Verification</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Active Hold State Audit</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• Atomic RPC Validation</text>
        <rect x="0" y="98" width="96" height="18" rx="4" fill="#FCE7F3" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#9D174D">SAFETY BARRIER</text>
      </g>
    </g>

  </g>

  <!-- ROW 2: 4 Stages (Right to Left) -->
  <g transform="translate(48, 320)" class="wf-sans">

    <!-- Connector Lines Row 2 (Right to Left) -->
    <path d="M 870 75 L 820 75" fill="none" stroke="#B42332" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 580 75 L 530 75" fill="none" stroke="#B42332" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 290 75 L 240 75" fill="none" stroke="#B42332" stroke-width="2" marker-end="url(#arrowRed)" />

    <!-- STAGE 8: Clinical Transfusion & Log (Destination, Leftmost in Row 2) -->
    <g transform="translate(0, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#1E8E3E" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#DCFCE7" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#1E8E3E" text-anchor="middle">8</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Verification &amp; Log</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• Hospital Physical Cross-Match</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Transfusion Completion Record</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• Automated 90-Day Hold Reset</text>
        <rect x="0" y="98" width="94" height="18" rx="4" fill="#DCFCE7" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#166534">FINAL RECORD</text>
      </g>
    </g>

    <!-- STAGE 7: P2P Voice Telemetry -->
    <g transform="translate(290, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">7</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">WebRTC P2P Voice</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• Peer-to-Peer Voice Calling</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Supabase Realtime Signaling</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• Ice Candidate Fallback Ring</text>
        <rect x="0" y="98" width="86" height="18" rx="4" fill="#E0F2FE" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#0369A1">VOICE CALL</text>
      </g>
    </g>

    <!-- STAGE 6: Private Encrypted Chat -->
    <g transform="translate(580, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">6</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Private Communication</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• Case-Scoped Direct Room</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Row-Level Security Enforced</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• ETA &amp; Location Sharing</text>
        <rect x="0" y="98" width="80" height="18" rx="4" fill="#F3E8FF" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#6B21A8">CHAT ROOM</text>
      </g>
    </g>

    <!-- STAGE 5: Donor Acceptance -->
    <g transform="translate(870, 0)">
      <rect width="235" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#wfCardShadow)" />
      <rect width="235" height="6" rx="3" fill="#B42332" />
      <g transform="translate(16, 20)">
        <rect width="24" height="24" rx="6" fill="#FEE2E2" />
        <text x="12" y="16" font-size="12" font-weight="800" fill="#B42332" text-anchor="middle">5</text>
        <text x="34" y="17" font-size="13.5" font-weight="700" fill="#202124">Donor Acceptance</text>
        <text x="0" y="44" font-size="12" font-weight="500" fill="#4B5563">• One-Click Acceptance RPC</text>
        <text x="0" y="64" font-size="12" font-weight="500" fill="#4B5563">• Donor Status -> DISPATCHED</text>
        <text x="0" y="84" font-size="12" font-weight="500" fill="#4B5563">• Transit ETA Broadcasted</text>
        <rect x="0" y="98" width="76" height="18" rx="4" fill="#FEF3C7" />
        <text x="6" y="111" font-size="9.5" font-weight="700" fill="#92400E">DISPATCHED</text>
      </g>
    </g>

  </g>
</svg>