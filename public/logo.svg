<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 169" width="130" height="169" fill="none">
  <defs>
    <!-- Outer Location Pin Red Gradient -->
    <linearGradient id="pinRedGradient" x1="65" y1="0" x2="65" y2="169" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E61E38" />
      <stop offset="100%" stop-color="#B80D25" />
    </linearGradient>

    <!-- Inner Blood Drop Red Gradient -->
    <linearGradient id="dropRedGradient" x1="65" y1="35" x2="65" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D63" />
      <stop offset="100%" stop-color="#D9142A" />
    </linearGradient>
  </defs>

  <!-- Outer Pin Pinhead Shape -->
  <path d="M 65 0 C 100.89 0 130 29.11 130 65 C 130 96.8 104.5 132.4 65 169 C 25.5 132.4 0 96.8 0 65 C 0 29.11 29.11 0 65 0 Z" fill="url(#pinRedGradient)" />

