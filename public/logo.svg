  <path d="M 65 20 C 89.85 20 110 40.15 110 65 C 110 88.5 90.2 114 65 142 C 39.8 114 20 88.5 20 65 C 20 40.15 40.15 20 65 20 Z" fill="#0F172A" />

  <!-- Inner Blood Drop -->
  <path d="M 65 35 C 65 35 44 60 44 74 C 44 85.6 53.4 95 65 95 C 76.6 95 86 85.6 86 74 C 86 60 65 35 65 35 Z" fill="url(#dropRedGradient)" />

  <!-- Blood Drop Light Reflection Highlight -->
  <path d="M 54 66 C 52 70 52 76 55 80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65" />

  <!-- Supporting Hand Cradling the Drop (Bottom Cutout inside cavity) -->
  <path d="M 32 94 C 40 92 48 94 56 102 C 64 110 74 114 85 110 C 94 106 99 98 100 92 C 100 92 90 106 78 106 C 68 106 58 98 48 92 C 40 88 34 91 32 94 Z" fill="url(#pinRedGradient)" />
</svg>
